<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Graph — novel2arg</title>
<style>
  /* ── tokens ─────────────────────────────────────────────────────────────────
     The viewer borrows the site it draws: court paper, ink, one stamp red, and
     a hairline rule. Routing kinds get dimmed <<register>> hues only, so colour
     never outranks the paper. */
  :root {
    --ink:#222; --paper:#fff; --rule:#c9c9c9; --stamp:#cc0000;
    --ink-2:#5a5a5a; --ink-3:#8a8578; --wash:#f7f6f4;
    --start:#4a7a35; --gate:#8c2f24; --post:#a86a10; --search:#1f5c8b;
    --serif:"Songti SC","SimSun","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    --prose:13px/1.65 var(--serif);
    --data:12px/1.5 var(--sans);
    --mono:11.5px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --rail:350px;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:var(--prose); color:var(--ink); background:var(--paper); }
  button, input { font:inherit; }

  /* ── masthead: reads like the site header it documents ───────────────────── */
  .masthead { position:sticky; top:0; z-index:3; background:var(--wash); border-bottom:1px solid var(--ink); }
  .masthead-row { display:flex; align-items:baseline; gap:14px; padding:9px 14px 7px; flex-wrap:wrap; }
  .title { font-family:var(--serif); font-size:16px; letter-spacing:.06em; }
  .title b { font-weight:700; }
  .subtitle { font:var(--data); color:var(--ink-2); letter-spacing:.04em; }
  .toolbar { display:flex; align-items:center; gap:10px; padding:5px 14px 7px; border-top:1px solid var(--rule); flex-wrap:wrap; }
  .ctl { display:inline-flex; align-items:center; gap:4px; font:var(--data); color:var(--ink-2); cursor:pointer; white-space:nowrap; }
  .ctl input { accent-color:var(--ink); margin:0; }
  .dot { width:9px; height:9px; border-radius:2px; }
  #kinds { display:flex; gap:9px; flex-wrap:wrap; }
  #kinds .ctl { color:var(--ink-3); }
  #kinds .ctl:has(input:checked) { color:var(--ink); }
  input#filter { font:var(--data); border:0; border-bottom:1px solid var(--rule); background:transparent; padding:1px 2px; width:15ch; color:var(--ink); }
  input#filter:focus-visible, button:focus-visible, .ctl:focus-within { outline:2px solid var(--search); outline-offset:2px; }
  button { font:var(--data); color:var(--ink); background:transparent; border:1px solid var(--rule); padding:2px 10px 3px; cursor:pointer; }
  button:hover { border-color:var(--ink); }

  /* ── canvas + ledger rail ────────────────────────────────────────────────── */
  /* dvh tracks the mobile URL bar; 100vh does not, and a wrapped masthead makes the guess wrong anyway. */
  main { display:flex; height:calc(100dvh - var(--head, 41px)); }
  #graphWrap { flex:1; min-width:0; overflow:auto; }
  #graphWrap svg { display:block; max-width:none; touch-action:pan-x pan-y; cursor:grab; }
  #graphWrap.zoomed svg { cursor:grabbing; }
  aside { flex:0 0 var(--rail); width:var(--rail); max-width:42vw; overflow-y:auto; padding:14px 16px 40px; border-left:1px solid var(--rule); background:var(--paper); }
  @media (max-width: 820px) {
    /* One column on a phone: the rail sits under the canvas instead of squeezing it to dust. */
    main { display:block; height:auto; }
    #graphWrap { height:58dvh; }
    aside { width:auto; max-width:none; flex:none; border-left:0; border-top:1px solid var(--rule); max-height:42dvh; }
  }

  /* ── the graph: rules, not frames ────────────────────────────────────────── */
  svg { background:var(--paper); }
  .grid { stroke:var(--wash); stroke-width:1; }
  .edge { fill:none; stroke-width:1.3; }
  .elabel { font:10px var(--mono); fill:var(--ink-3); }
  .lock { font:9px var(--sans); fill:var(--gate); }
  .node { cursor:pointer; }
  .node .card { fill:var(--paper); stroke:var(--rule); stroke-width:1; }
  .node .file { font:12.5px var(--serif); fill:var(--ink); }
  .node .path { font:10px var(--sans); fill:var(--ink-3); letter-spacing:.02em; }
  /* the ink bar sits on the left edge and carries span count / query fields — the site-map margin mark */
  .node .bar { fill:var(--rule); }
  .node .meta { font:10px var(--sans); fill:var(--ink-2); }
  /* progress reads like a court docket: the ordering the fiction expects, typed as a number */
  .node .docket { font:11px var(--mono); fill:var(--ink-3); text-anchor:end; }
  .node .warn { font:10px var(--sans); fill:var(--stamp); text-anchor:end; letter-spacing:.04em; }
  .node.gate .card { stroke-width:1.6; }
  .node.gate .bar { fill:var(--gate); }
  .node.search .card { stroke-dasharray:1 2; }
  .node.search .bar { fill:var(--search); }
  .node.unreach .card { stroke:var(--stamp); stroke-dasharray:2 2; }
  .node.unreach .bar { fill:var(--stamp); }
  .node.selected .card { stroke:var(--ink); stroke-width:2; }
  .node.selected .bar { fill:var(--ink); }
  .node.pulse .card { stroke:var(--search); stroke-width:3; }
  .rank-label { font:10px var(--mono); fill:var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  /* ── ledger rail: entry / inspection record ──────────────────────────────── */
  aside h2 { font:600 15px/1.5 var(--serif); margin:0 0 2px; word-break:break-all; }
  aside h3 { font:600 13px/1.6 var(--serif); margin:16px 0 4px; padding-bottom:3px; border-bottom:1px solid var(--rule); }
  aside h2 + .caption { font:var(--data); color:var(--ink-3); margin-bottom:8px; }
  .empty { color:var(--ink-2); margin:0 0 8px; }
  .hint { font:12px/1.7 var(--serif); color:var(--ink-3); }
  .kv { margin:3px 0; font:var(--prose); }
  .kv b { font:600 12px var(--sans); color:var(--ink-2); font-weight:600; }
  .kv.small { font:var(--data); color:var(--ink-2); margin-left:10px; }
  .src { color:var(--search); text-decoration:none; border-bottom:1px solid rgba(31,92,139,.35); cursor:pointer; }
  .src:hover { border-bottom-color:var(--search); }
  .prob { font:var(--prose); color:var(--gate); cursor:pointer; margin:3px 0; padding-left:9px; border-left:2px solid transparent; }
  .prob:hover { border-left-color:var(--stamp); }
  .prob.clean { color:var(--ink-2); cursor:default; }
  .frow { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:baseline; }
  .frow dt { font:var(--data); color:var(--ink-3); white-space:nowrap; }
  .frow dd { margin:0; font:var(--prose); }
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-row">
    <span class="title"><b>层级图</b> · site graph</span>
    <span id="meta" class="subtitle"></span>
  </div>
  <div class="toolbar">
    <label class="ctl"><input type="checkbox" id="chromeCtl" checked>框架边</label>
    <span id="kinds"></span>
    <input id="filter" placeholder="筛选路径…" aria-label="按路径筛选">
    <button id="problemsBtn">问题清单</button>
    <button id="fitBtn">适应宽度</button>
  </div>
</header>
<main>
  <div id="graphWrap"><svg id="graph" role="img" aria-label="站点链接图"></svg></div>
  <aside id="panel"></aside>
</main>
<script type="application/json" id="graph-data">__SITE_GRAPH_JSON__</script>
<script>
'use strict';
const graph = JSON.parse(document.getElementById('graph-data').textContent);
/* Routing kinds use dimmed register hues; chrome rules at 1px and 35% so the 378 of them
   recede into paper texture and only the fiction's own routes read as ink. */
const KIND_STYLE = {
  start:        { c: '#4a7a35', w: 1.8, label: 'start' },
  nav:          { c: '#c9c9c9', w: 1,   label: 'nav' },
  footer:       { c: '#c9c9c9', w: 1,   label: 'footer' },
  breadcrumb:   { c: '#8a8578', w: 1.1, dash: '3 3', label: 'breadcrumb' },
  list:         { c: '#5a5a5a', w: 1.3, label: 'list' },
  body:         { c: '#5a5a5a', w: 1.3, label: 'body' },
  form:         { c: '#5a5a5a', w: 1.3, dash: '4 2', label: 'form' },
  'gate-next':  { c: '#8c2f24', w: 1.7, label: 'gate-next' },
  'post-unlock':{ c: '#a86a10', w: 1.5, dash: '6 3', label: 'post-unlock' },
  search:       { c: '#1f5c8b', w: 1.4, dash: '2 3', label: 'search' },
};
const KIND_LABEL = { start:'入口', nav:'主导航', footer:'页脚', breadcrumb:'面包屑', list:'列表', body:'正文', form:'表单', 'gate-next':'门禁后继', 'post-unlock':'解锁后', search:'搜索命中的' };
// Layout constants — module scope so both layout() and render() can read them.
const NW = 192, NH = 54, GX = 36, GY = 92, PAD = 34;
const BAR = 2.5;            // the ink bar on the node's left edge
const nodeById = new Map(graph.nodes.map((n) => [n.id, n]));
const state = { kinds: new Set(Object.keys(KIND_STYLE)), chrome: true, filter: '' };
const $ = (s) => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const el = (t, attrs) => { const e = document.createElementNS(NS, t); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// The file name is the identity; the directory only disambiguates, so it gets the quiet line.
const splitId = (id) => { const i = id.lastIndexOf('/'); return i < 0 ? { file: id, dir: '' } : { file: id.slice(i + 1), dir: id.slice(0, i) }; };
const afterGate = (s) => s + (s.afterGate ? '（需先过本页门禁）' : '');

function visibleEdges() {
  return graph.edges.filter((e) => {
    if (!KIND_STYLE[e.kind]) return false;
    if (e.chrome && !state.chrome) return false;
    if (!state.kinds.has(e.kind)) return false;
    if (state.filter && !(e.from.includes(state.filter) || e.to.includes(state.filter))) return false;
    return nodeById.has(e.from) && nodeById.has(e.to);
  });
}

// Layered layout: rank by hops (entry on top; unreachable in a trailing orphan rank), order
// within a rank by M7 progress page (reading order), then two barycenter passes over the
// currently visible edges to reduce crossings.
function layout() {
  const edges = visibleEdges();
  const maxHops = Math.max(0, ...graph.nodes.map((n) => n.hops ?? 0));
  const orphanRank = maxHops + 1;
  const byRank = new Map();
  for (const n of graph.nodes) {
    const r = n.hops ?? orphanRank;
    if (!byRank.has(r)) byRank.set(r, []);
    byRank.get(r).push(n);
  }
  const order = new Map();
  for (const list of byRank.values()) {
    list.sort((a, b) => (a.progress.page ?? 1e9) - (b.progress.page ?? 1e9) || a.id.localeCompare(b.id));
    list.forEach((n, i) => order.set(n.id, i));
  }
  for (let pass = 0; pass < 2; pass++) {
    const sum = new Map(), cnt = new Map();
    for (const e of edges) for (const [x, y] of [[e.from, e.to], [e.to, e.from]]) {
      if (!order.has(x) || !order.has(y)) continue;
      sum.set(x, (sum.get(x) ?? 0) + order.get(y)); cnt.set(x, (cnt.get(x) ?? 0) + 1);
    }
    for (const list of byRank.values()) {
      list.sort((a, b) => {
        const sa = sum.has(a.id) ? sum.get(a.id) / cnt.get(a.id) : order.get(a.id);
        const sb = sum.has(b.id) ? sum.get(b.id) / cnt.get(b.id) : order.get(b.id);
        return sa - sb || a.id.localeCompare(b.id);
      });
      list.forEach((n, i) => order.set(n.id, i));
    }
  }
  const pos = new Map();
  for (const [r, list] of byRank) list.forEach((n, i) => pos.set(n.id, { x: PAD + i * (NW + GX), y: PAD + r * (NH + GY) }));
  const width = Math.max(60, ...[...byRank.values()].map((l) => PAD * 2 + l.length * (NW + GX) - GX));
  const height = PAD * 2 + (Math.max(...byRank.keys()) + 1) * (NH + GY);
  const rankY = new Map([...byRank.keys()].map((r) => [r, PAD + r * (NH + GY)]));
  return { pos, edges, byRank, rankY, width, height };
}

// Fit-to-width: the full canvas is wide, so on a narrow screen the viewer opens scaled down, centered,
// and the reader zooms into what matters. Zoomed in, the canvas pans by drag or scroll.
// The canvas owns its pixel coordinates; fit() only writes width/height, so pointer positions need no math.
function fit() {
  const wrap = $('#graphWrap'), svg = $('#graph'), btn = $('#fitBtn');
  const cw = svg.dataset.cw, ch = svg.dataset.ch;
  const natural = svg.getAttribute('width') === cw;
  if (natural) { svg.setAttribute('width', '100%'); svg.setAttribute('height', 'auto'); btn.textContent = '适应宽度'; }
  else { svg.setAttribute('width', cw); svg.setAttribute('height', ch); btn.textContent = '原始大小'; }
  wrap.classList.toggle('zoomed', !natural);
}

function render() {
  const { pos, edges, byRank, rankY, width, height } = layout();
  const svg = $('#graph');
  svg.innerHTML = '';
  svg.dataset.cw = width; svg.dataset.ch = height;
  if ($('#fitBtn').textContent === '原始大小') { svg.setAttribute('width', width); svg.setAttribute('height', height); }
  else { svg.setAttribute('width', '100%'); svg.setAttribute('height', 'auto'); }
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  const defs = el('defs');
  for (const [kind, s] of Object.entries(KIND_STYLE)) {
    const m = el('marker', { id: `arr-${kind}`, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
    const p = el('path', { d: 'M0,0 L10,5 L0,10 z' }); p.style.fill = s.c; p.style.opacity = kind === 'nav' || kind === 'footer' ? '.35' : '1';
    m.appendChild(p); defs.appendChild(m);
  }
  svg.appendChild(defs);

  // Rank rules: the hop distance is the fiction's route depth, so it gets the margin mark.
  for (const [r, y] of rankY) {
    svg.appendChild(el('line', { x1: 0, y1: y - GY / 2, x2: width, y2: y - GY / 2, class: 'grid' }));
    const t = el('text', { x: 10, y: y - GY / 2 - 5, class: 'rank-label' });
    t.textContent = `hop ${r}`;
    svg.appendChild(t);
  }

  for (const e of edges) {
    const a = pos.get(e.from), b = pos.get(e.to), s = KIND_STYLE[e.kind];
    const x1 = a.x + NW / 2, y1 = a.y + NH, x2 = b.x + NW / 2, y2 = b.y;
    let d;
    if (y2 > y1 + 4) d = `M${x1},${y1} C${x1},${y1 + 44} ${x2},${y2 - 44} ${x2},${y2}`;
    else { const mx = Math.max(x1, x2) + 70; d = `M${x1},${y1 - NH / 2} C${mx},${y1 - NH / 2} ${mx},${y2 + NH / 2} ${x2},${y2 + NH / 2}`; }
    const quiet = e.chrome;
    const p = el('path', {
      d, class: 'edge', 'marker-end': `url(#arr-${e.kind})`, 'marker-start': quiet ? '' : `url(#arr-${e.kind})`,
      'stroke-opacity': quiet ? '.35' : '1',
    });
    p.style.stroke = s.c; p.style.strokeWidth = quiet ? 1 : s.w;
    if (s.dash) p.setAttribute('stroke-dasharray', s.dash);
    p.addEventListener('click', () => select('edge', e));
    svg.appendChild(p);
    const label = e.guard ? '🔒 ' + e.guard.type : e.kind === 'search' ? e.evidence : '';
    if (label) {
      const t = el('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 4, class: 'elabel', 'text-anchor': 'middle' });
      t.textContent = label.length > 30 ? label.slice(0, 29) + '…' : label;
      svg.appendChild(t);
    }
  }

  // Nodes: a document card. Left bar = the page's own weight (gate/search/unreachable),
  // body = file name + the quiet span count / query fields, docket = M7 progress order.
  for (const n of graph.nodes) {
    if (!pos.has(n.id)) continue;
    const { x, y } = pos.get(n.id);
    const cls = ['node'];
    if (n.gate) cls.push('gate');
    if (n.isSearch) cls.push('search');
    if (!n.reachable) cls.push('unreach');
    const g = el('g', { class: cls.join(' '), transform: `translate(${x},${y})` });
    g.appendChild(el('rect', { class: 'card', width: NW, height: NH, rx: 2 }));
    g.appendChild(el('rect', { class: 'bar', x: 0, y: 0, width: BAR, height: NH, rx: 1 }));
    const { file, dir } = splitId(n.id);
    const t1 = el('text', { x: BAR + 9, y: 21, class: 'file' }); t1.textContent = file.length > 24 ? file.slice(0, 23) + '…' : file; g.appendChild(t1);
    const bits = [];
    if (dir) bits.push(dir);
    if (n.role === 'search') bits.push('搜索页');
    if (n.gate) bits.push(n.gate.fields.length ? `门禁 ${n.gate.fields.length} 项` : '门禁');
    if (n.access.length) bits.push('账号 ' + n.access.join('/'));
    const t2 = el('text', { x: BAR + 9, y: 38, class: 'path' }); t2.textContent = bits.join(' · ').slice(0, 34); g.appendChild(t2);
    if (n.progress.page != null) {
      const t3 = el('text', { x: NW - 9, y: NH - 9, class: 'docket' });
      t3.textContent = `#${n.progress.page}/${n.progress.total ?? '?'}`;
      g.appendChild(t3);
    }
    if (!n.reachable) {
      const t4 = el('text', { x: NW - 9, y: 16, class: 'warn' }); t4.textContent = '不可达'; g.appendChild(t4);
    } else if (n.isEntry) {
      const t4 = el('text', { x: NW - 9, y: 16, class: 'warn' }); t4.style.fill = 'var(--start)'; t4.textContent = '入口'; g.appendChild(t4);
    }
    g.addEventListener('click', () => select('node', n));
    svg.appendChild(g);
  }
}

let pos0 = new Map();
function pulse(id) {
  const nodes = [...document.querySelectorAll('.node')];
  const p = pos0.get(id);
  if (!p) return;
  const g = nodes.find((n) => n.getAttribute('transform') === `translate(${p.x},${p.y})`);
  if (!g) return;
  g.classList.add('pulse');
  setTimeout(() => g.classList.remove('pulse'), 1600);
}

function guardHtml(guard) {
  if (!guard) return '<div class="kv"><b>guard:</b> none — free traversal</div>';
  let h = `<div class="kv"><b>guard:</b> ${esc(guard.type)}</div>`;
  if (guard.type === 'credential') {
    guard.fields.forEach((f, i) => {
      if (f.via === 'verbatim') h += `<div class="kv">field ${i + 1}: ${esc(JSON.stringify(f.plain))} ← ${f.sources.map((s) => `<span class="src" data-page="${esc(s.page)}">${esc(s.page)}</span>${s.afterGate ? '（需先过本页门禁）' : ''}`).join(' + ')}</div>`;
      else if (f.via === 'derived') h += `<div class="kv">field ${i + 1}: derived — rule: ${esc(f.rule)} ← ${f.components.map((c) => `<span class="src" data-page="${esc(c.page)}">${esc(c.text)} @ ${esc(c.page)}</span>`).join(' + ')}</div>`;
      else h += `<div class="kv">field ${i + 1}: <b>NO CLUE</b></div>`;
    });
  }
  if (guard.type === 'keyword') h += `<div class="kv">keyword: ${esc(guard.keyword ?? guard.hash)} ← ${guard.sources.map((s) => `<span class="src" data-page="${esc(s.page)}">${esc(s.page)}</span>`).join(' + ')}</div>`;
  if (guard.requires?.length) h += `<div class="kv">requires: ${esc(guard.requires.join(', '))} (granted by ${(guard.grantedBy ?? []).map((g) => `<span class="src" data-page="${esc(g)}">${esc(g)}</span>`).join(', ') || 'nothing'})</div>`;
  return h;
}

const KIND_ZH = { start:'入口', nav:'主导航', footer:'页脚', breadcrumb:'面包屑', list:'列表', body:'正文', form:'表单', 'gate-next':'门禁后继', 'post-unlock':'解锁后', search:'搜索命中' };

function select(kind, obj) {
  pos0 = layout().pos;
  let h = '';
  if (kind === 'edge') {
    const e = obj;
    h = `<h2>${esc(e.from)} → ${esc(e.to)}</h2>
      <div class="caption">一条跳转边 · ${KIND_ZH[e.kind] ?? e.kind}${e.chrome ? '（框架边）' : ''}</div>
      <h3>证据与判据</h3>
      <dl class="frow">
        <dt>evidence</dt><dd>${esc(e.evidence)}</dd>
        <dt>kind</dt><dd>${esc(e.kind)}</dd>
        <dt>route</dt><dd>${e.route ?? '—'} · ${esc(e.routeClaim)}</dd>
        <dt>进度 Δ</dt><dd>${e.progressDelta ?? '—'}${e.backJump ? ' <span style="color:var(--stamp)">回跳，需复核</span>' : ''}</dd>
      </dl>
      <h3>守卫</h3>${guardHtml(e.guard)}`;
  } else {
    const n = obj;
    const bits = [n.role ?? '—', `跳数 ${n.hops ?? '—'}`, n.reachable ? '可达' : '不可达'];
    h = `<h2>${esc(n.id)}</h2>
      <div class="caption">${esc(bits.join(' · '))}</div>
      <h3>页面</h3>
      <dl class="frow">
        <dt>title</dt><dd>${esc(n.title ?? '—')}</dd>
        <dt>进度</dt><dd>${esc(n.progress.raw ?? '—')} · ${esc(n.progress.source)}${n.progress.anomalous ? ' <span style="color:var(--stamp)">异常</span>' : ''}</dd>
        ${n.gate ? `<dt>门禁</dt><dd>${n.gate.fields.length} 项 · grants ${esc(n.gate.grants.join(', ') || '—')}</dd>` : ''}
        ${n.access.length ? `<dt>账号</dt><dd>${esc(n.access.join(', '))}</dd>` : ''}
      </dl>
      ${n.supplies.length ? `<h3>本页供给</h3>` + n.supplies.map((s) => `<div class="kv">${esc(s.kind)}: ${esc(JSON.stringify(s.plain))}${s.afterGate ? ' <span class="hint">（过本页门禁后）</span>' : ''}</div>`).join('') : ''}`;
  }
  $('#panel').innerHTML = h;
  for (const s of document.querySelectorAll('.src')) s.addEventListener('click', () => pulse(s.dataset.page));
  for (const g of document.querySelectorAll('.node')) g.classList.remove('selected');
  if (kind === 'node') {
    const p = pos0.get(obj.id);
    const g = p && [...document.querySelectorAll('.node')].find((n) => n.getAttribute('transform') === `translate(${p.x},${p.y})`);
    if (g) g.classList.add('selected');
  }
}

function emptyPanel() {
  $('#panel').innerHTML = `<p class="empty">点节点或边，看它的判据。</p>
    <p class="hint">拖动可平移，滚轮 / 双指缩放，<b>适应宽度</b> 可看全图。<br>
    左侧色条是页面的性质：粗红=门禁，蓝虚线=搜索页，红虚线=不可达。<br>
    右下角 <span style="font-family:var(--mono)">#n/总</span> 是 M7 的阅读顺序。</p>`;
}

function problemsPanel() {
  const h = '<h2>问题清单</h2><div class="caption">图自己报的疑点，点一条跳到对应节点。</div>' + (graph.problems.length
    ? graph.problems.map((p) => {
        const id = p.page ?? p.node ?? p.detail ?? '';
        const label = p.page ?? p.node ?? p.detail ?? p.edge ?? p.url ?? '';
        return `<div class="prob" data-page="${esc(id)}">${esc(p.type)} — ${esc(label)}${p.fields ? ' [' + esc(p.fields.join(', ')) + ']' : ''}</div>`;
      }).join('')
    : '<p class="empty">none</p>');
  $('#panel').innerHTML = h;
  for (const p of document.querySelectorAll('.prob')) p.addEventListener('click', () => { const id = p.dataset.page; if (nodeById.has(id)) select('node', nodeById.get(id)); });
}

$('#chromeCtl').addEventListener('change', (ev) => { state.chrome = ev.target.checked; render(); });
$('#fitBtn').addEventListener('click', fit);
// Keep the sticky-header height honest: the controls wrap on a narrow screen, and 100dvh minus a
// hard-coded 41px would hide the bottom of the canvas behind the fold.
function syncHead() { document.documentElement.style.setProperty('--head', `${document.querySelector('header').offsetHeight}px`); }
addEventListener('resize', syncHead);
syncHead();
$('#filter').addEventListener('input', (ev) => { state.filter = ev.target.value.trim(); render(); });
$('#problemsBtn').addEventListener('click', problemsPanel);
for (const kind of Object.keys(KIND_STYLE)) {
  const s = KIND_STYLE[kind];
  const lab = document.createElement('label');
  lab.className = 'ctl';
  const zh = KIND_LABEL[kind] ?? kind;
  lab.innerHTML = `<input type="checkbox" checked aria-label="显示 ${zh} 边"><span class="dot" style="background:${s.c}"></span>${zh}`;
  lab.querySelector('input').addEventListener('change', (ev) => { ev.target.checked ? state.kinds.add(kind) : state.kinds.delete(kind); render(); });
  $('#kinds').appendChild(lab);
}
$('#meta').textContent = `${graph.stats.pages} 页 · ${graph.stats.edges} 边 · ${graph.stats.problems} 个疑点 · 生成于 ${graph.generatedAt}`;
emptyPanel();
render();
</script>
</body>
</html>
